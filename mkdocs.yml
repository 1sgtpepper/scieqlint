site_name: SciEqLint
site_description: Deterministic equation, reference, and MyST structure linting for scientific documents.
repo_url: https://github.com/Kuhai9801/scieqlint
repo_name: Kuhai9801/scieqlint
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.instant
    - content.code.copy

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Limitations: limitations.md
  - Diagnostics: diagnostics.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - API: api.md
  - Release ladder: release-ladder.md
  - Integrations:
      - GitHub annotations: integrations/github-annotations.md
      - pre-commit: integrations/pre-commit.md
      - SARIF: integrations/sarif.md
  - Contributing:
      - Overview: contributing/index.md
      - Development setup: contributing/dev-setup.md
      - Architecture map: contributing/architecture-map.md
      - PR dependency checks: contributing/pr-dependency-checks.md
      - Testing: contributing/testing.md
      - Golden files: contributing/golden-files.md
      - Diagnostics: contributing/diagnostics.md
      - Release scope: contributing/release-scope.md
      - Review guide: contributing/review-guide.md
      - Issue guide: contributing/issue-guide.md
  - Release checklists:
      - v0.0.1: releases/v0.0.1-checklist.md
      - v0.1.0: releases/v0.1.0-checklist.md
      - v0.1.1: releases/v0.1.1-checklist.md
      - v0.1.2: releases/v0.1.2-checklist.md
      - v0.1.3: releases/v0.1.3-checklist.md
      - v0.1.4: releases/v0.1.4-checklist.md
      - v0.1.5: releases/v0.1.5-checklist.md
      - v0.1.5 tag: releases/v0.1.5-tag-checklist.md
      - v1.0.0: releases/v1.0.0-checklist.md
      - v1.0.0 stabilization: releases/v1.0.0-stabilization-checklist.md
      - v1.0.0 contract readiness: releases/v1.0.0-contract-readiness.md
      - v1.1.0: releases/v1.1.0-checklist.md
  - Security: security.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
