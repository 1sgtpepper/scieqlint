name: Starter task
description: Create a scoped contributor-friendly task.
title: "starter: "
labels: ["good first issue", "mentor available"]
body:
  - type: input
    id: why
    attributes:
      label: Why this matters
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release target
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area label
      placeholder: "area:parser"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Likely files
      description: List likely files, but do not require the contributor to use only these files.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: nongoals
    attributes:
      label: Non-goals
    validations:
      required: true
