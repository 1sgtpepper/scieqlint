name: Docs issue
description: Report confusing, missing, or outdated docs.
title: "docs: "
labels: ["area:docs"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: "docs/limitations.md"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is confusing or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
    validations:
      required: false
