name: Feature request
description: Propose a scoped feature for a release.
title: "feature: "
labels: ["help wanted"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What user-visible problem does this solve?
    validations:
      required: true
  - type: dropdown
    id: release
    attributes:
      label: Proposed release
      options:
        - v0.1.0
        - v0.1.1
        - v0.1.2
        - v0.1.3
        - v0.1.4
        - v0.1.5
        - v0.2.0+
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Narrow scope
      description: What is included and what is explicitly excluded?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet the smallest testable acceptance criteria.
    validations:
      required: true
