name: Bug report
description: Report reproducible incorrect behavior.
title: ""
labels:
  - bug
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched open and closed issues for the same bug.
          required: true
        - label: This is not a security issue.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State the incorrect behavior directly.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest runnable command, input, and observed output.
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: State what should happen instead.
    validations:
      required: true
  - type: textarea
    id: affected-version
    attributes:
      label: Affected version
      description: Include the SciEqLint release or commit. Add Python and OS only when relevant.
      render: text
    validations:
      required: true
