name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dev environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Pyright
        run: pyright
      - name: Import boundaries
        run: lint-imports || python -m lint_imports

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Pytest
        run: pytest --cov=scieqlint --cov-report=term-missing
      - name: Coverage gates
        run: |
          coverage report --fail-under=85
          coverage report --include='src/scieqlint/check/references.py' --fail-under=95
          coverage report --include='src/scieqlint/report/json.py' --fail-under=95
          coverage report --include='src/scieqlint/report/github.py' --fail-under=95

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Clean venv smoke test
        run: |
          python -m venv /tmp/scieqlint-smoke
          /tmp/scieqlint-smoke/bin/python -m pip install dist/*.whl
          /tmp/scieqlint-smoke/bin/scieqlint --help
          /tmp/scieqlint-smoke/bin/python -m scieqlint --help

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build docs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[docs]'
          mkdocs build --strict

  self-check:
    name: self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run SciEqLint smoke on examples
        run: scieqlint check "examples/good/**/*.md" --format text
