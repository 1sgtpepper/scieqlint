name: SciEqLint SARIF Example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scieqlint-sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
      - name: Install SciEqLint
        run: python -m pip install scieqlint==1.1.0
      - name: Run SciEqLint SARIF
        run: scieqlint check "docs/**/*.md" "docs/**/*.ipynb" --format sarif --output scieqlint.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          sarif_file: scieqlint.sarif
          category: scieqlint-docs
