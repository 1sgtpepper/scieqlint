name: SciEqLint SARIF Example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scieqlint-sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Install SciEqLint
        run: python -m pip install scieqlint==1.2.2
      - name: Remove stale SARIF output
        run: rm -f scieqlint.sarif
      - name: Run SciEqLint SARIF
        run: set +e; scieqlint check "docs/**/*.md" "docs/**/*.ipynb" --format sarif --output scieqlint.sarif; status=$?; test "$status" -le 1 || exit "$status"
      - name: Verify SARIF output
        run: test -s scieqlint.sarif && python -m json.tool scieqlint.sarif >/dev/null
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: scieqlint.sarif
          category: scieqlint-docs
