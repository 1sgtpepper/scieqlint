name: SciEqLint SARIF Example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scieqlint-sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install SciEqLint
        run: python -m pip install scieqlint==1.1.0
      - name: Remove stale SARIF output
        run: rm -f scieqlint.sarif
      - name: Run SciEqLint SARIF
        run: set +e; scieqlint check "docs/**/*.md" "docs/**/*.ipynb" --format sarif --output scieqlint.sarif; status=$?; test "$status" -le 1 || exit "$status"
      - name: Verify SARIF output
        run: test -s scieqlint.sarif && python -m json.tool scieqlint.sarif >/dev/null
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          sarif_file: scieqlint.sarif
          category: scieqlint-docs
