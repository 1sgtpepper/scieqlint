name: SciEqLint SARIF Example

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scieqlint-sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install SciEqLint
        run: python -m pip install scieqlint==0.1.5
      - name: Run SciEqLint SARIF
        run: scieqlint check "docs/**/*.md" "docs/**/*.ipynb" --format sarif --output scieqlint.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scieqlint.sarif
          category: scieqlint-docs
