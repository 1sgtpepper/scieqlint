name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/*

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist
      - name: Clean wheel smoke
        run: |
          python -m venv /tmp/scieqlint-release-smoke
          /tmp/scieqlint-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/scieqlint-release-smoke/bin/scieqlint --help
          /tmp/scieqlint-release-smoke/bin/scieqlint demo
          /tmp/scieqlint-release-smoke/bin/python - <<'PY'
          from importlib import resources

          expected = {
              "scieqlint": ["py.typed"],
              "scieqlint.examples.bad": ["famous_bad.md"],
              "scieqlint.examples.good": ["algebra_good.md"],
              "scieqlint.parse": ["grammar.lark"],
              "scieqlint.presets": ["mechanics.toml"],
              "scieqlint.schemas": [
                  "scieqlint-diagnostic-0.1.schema.json",
                  "scieqlint-graph-0.3.schema.json",
                  "scieqlint-result-0.1.schema.json",
              ],
          }
          for package, names in expected.items():
              package_files = resources.files(package)
              for name in names:
                  assert package_files.joinpath(name).is_file(), f"{package}:{name} missing"
          PY

  publish:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
