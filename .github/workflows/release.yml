name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/*

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist
      - name: Clean wheel smoke
        run: |
          python -m venv /tmp/scieqlint-release-smoke
          /tmp/scieqlint-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/scieqlint-release-smoke/bin/scieqlint --help
          /tmp/scieqlint-release-smoke/bin/scieqlint demo
          /tmp/scieqlint-release-smoke/bin/python - <<'PY'
          from importlib import resources

          preset = resources.files("scieqlint.presets").joinpath("mechanics.toml")
          assert preset.is_file(), "mechanics preset missing from installed wheel"
          PY
      - name: Verify source, wheel, and tag versions
        run: |
          source_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"
          wheel_version="$(/tmp/scieqlint-release-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          print(version("scieqlint"))
          PY
          )"
          test "$wheel_version" = "$source_version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$source_version"
          fi
      - name: Enforce stable-release accuracy and performance evidence
        run: |
          python -m pip install -e '.[dev]'
          SCIEQLINT_RELEASE_GATE=1 python -m pytest -q \
            tests/test_accuracy_benchmarks.py \
            tests/test_stabilization.py

  publish:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
