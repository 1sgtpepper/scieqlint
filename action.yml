name: SciEqLint
description: Run SciEqLint from GitHub Actions.

inputs:
  python-version:
    description: Python version used to install and run SciEqLint.
    required: false
    default: "3.11"
  package-version:
    description: SciEqLint package version to install from PyPI.
    required: false
    default: "1.0.0"
  args:
    description: Arguments passed to the scieqlint CLI.
    required: false
    default: "check ."

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install SciEqLint
      shell: bash
      env:
        SCIEQLINT_PACKAGE_VERSION: ${{ inputs.package-version }}
      run: |
        python - <<'PY'
        import os
        import re
        import subprocess
        import sys

        version = os.environ["SCIEQLINT_PACKAGE_VERSION"]
        if not re.fullmatch(r"[A-Za-z0-9_.!+*-]+", version):
            raise SystemExit("package-version must be a plain Python package version")
        subprocess.check_call([sys.executable, "-m", "pip", "install", f"scieqlint=={version}"])
        PY
    - name: Run SciEqLint
      shell: bash
      env:
        SCIEQLINT_ARGS: ${{ inputs.args }}
      run: |
        python - <<'PY'
        import os
        import shlex
        import subprocess

        args = shlex.split(os.environ["SCIEQLINT_ARGS"])
        subprocess.check_call(["scieqlint", *args])
        PY
