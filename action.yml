name: SciEqLint
description: Run SciEqLint from GitHub Actions.

inputs:
  python-version:
    description: Python version used to install and run SciEqLint.
    required: false
    default: "3.11"
  package-version:
    description: SciEqLint package version to install from PyPI.
    required: false
    default: "1.1.0"
  args:
    description: Arguments passed to the scieqlint CLI.
    required: false
    default: "check ."

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install SciEqLint
      shell: bash
      run: python -m pip install "scieqlint==${{ inputs.package-version }}"
    - name: Run SciEqLint
      shell: bash
      run: scieqlint ${{ inputs.args }}
