cases:
  - id: dimension-zero-config-quiet
    release: v0.1.2
    input: "F = m*a"
    expected_codes: []
    expected_pass: true

  - id: mechanics-force-good
    release: v0.1.2
    input: "F = m*a"
    vars: {"m": "M", "a": "L T^-2", "F": "M L T^-2"}
    expected_codes: []
    expected_pass: true

  - id: mechanics-energy-good
    release: v0.1.2
    input: "E = m*c^2"
    vars: {"m": "M", "c": "L T^-1", "E": "M L^2 T^-2"}
    expected_codes: []
    expected_pass: true

  - id: mechanics-energy-bad
    release: v0.1.2
    input: "E = m*c"
    vars: {"m": "M", "c": "L T^-1", "E": "M L^2 T^-2"}
    expected_codes: ["DIM001"]
    expected_pass: false

  - id: mechanics-addition-bad
    release: v0.1.2
    input: "x + t = x"
    vars: {"x": "L", "t": "T"}
    expected_codes: ["DIM002"]
    expected_pass: false

  - id: mechanics-unknown-warn
    release: v0.1.2
    input: "F = m*j"
    vars: {"m": "M", "F": "M L T^-2"}
    unknown_variables: "warn"
    expected_codes: ["DIM010"]
    expected_pass: true
